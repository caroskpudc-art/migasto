<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiEssential</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] m-0 p-0">
  <div id="root"></div>
  <script>
    const { useState } = React;
    function MiEssentialApp() {
      const [activeTab, setActiveTab] = useState("dashboard");
      const [budgets] = useState({
        totalMonthly: 750,
        categories: {
          "Supermercado & Alimentación": 250,
          "Ocio & Restaurantes": 200,
          "Hogar & Suministros": 150,
          "Suscripciones & Apps": 100,
          "Otros": 50
        }
      });
      const [savingsGoals] = useState([
        { id: 1, name: "Colchón de seguridad", target: 2000, current: 1200 },
        { id: 2, name: "Viaje / Vacaciones", target: 800, current: 450 }
      ]);
      const [transactions, setTransactions] = useState([
        { id: 1, merchant: "Planeta Huerto", amount: 14.50, category: "Supermercado & Alimentación", date: "Hoy, 10:30", type: "apple-pay", unnecessary: false },
        { id: 2, merchant: "Spotify", amount: 10.99, category: "Suscripciones & Apps", date: "Ayer", type: "apple-pay", unnecessary: true },
        { id: 3, merchant: "Cafetería Local", amount: 3.80, category: "Ocio & Restaurantes", date: "Hace 2 días", type: "apple-pay", unnecessary: true }
      ]);
      const [chatMessages, setChatMessages] = useState([
        { role: "assistant", text: "¡Hola! Soy tu asistente financiero de MiEssential. ¿Cómo vas este mes?" }
      ]);
      const [inputMessage, setInputMessage] = useState("");
      const [simulatedMerchant, setSimulatedMerchant] = useState("");
      const [simulatedAmount, setSimulatedAmount] = useState("");

      const totalSpent = transactions.reduce((acc, t) => acc + t.amount, 0);
      const totalSavings = savingsGoals.reduce((acc, g) => acc + g.current, 0);
      const budgetLimit = budgets.totalMonthly;
      const totalAvailable = budgetLimit - totalSpent;
      const effectiveSavings = Math.max(0, totalSavings);

      const handleSimulateApplePay = (e) => {
        e.preventDefault();
        if (!simulatedMerchant || !simulatedAmount) return;
        const amountNum = parseFloat(simulatedAmount);
        const newTx = {
          id: Date.now(),
          merchant: simulatedMerchant,
          amount: amountNum,
          category: "Otros",
          date: "Justo ahora",
          type: "apple-pay",
          unnecessary: amountNum < 20
        };
        setTransactions([newTx, ...transactions]);
        setSimulatedMerchant("");
        setSimulatedAmount("");
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMessage.trim()) return;
        const userMsg = inputMessage;
        setChatMessages((prev) => [...prev, { role: "user", text: userMsg }]);
        setInputMessage("");
        setTimeout(() => {
          let reply = `Llevas gastados ${totalSpent.toFixed(2)}€ de tu presupuesto de ${budgetLimit}€. Tu total disponible es de ${totalAvailable.toFixed(2)}€.`;
          setChatMessages((prev) => [...prev, { role: "assistant", text: reply }]);
        }, 600);
      };

      return React.createElement('div', { style: { fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif', backgroundColor: '#F5F5F7', color: '#1D1D1F', minHeight: '100vh', paddingBottom: '40px' } },
        React.createElement('header', { style: { backgroundColor: 'rgba(255, 255, 255, 0.85)', backdropFilter: 'blur(20px)', position: 'sticky', top: 0, zIndex: 100, borderBottom: '1px solid rgba(0,0,0,0.06)', padding: '12px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
          React.createElement('h1', { style: { fontSize: '18px', fontWeight: 600, margin: 0 } }, 'Mi', React.createElement('span', { style: { color: '#0071E3' } }, 'Essential')),
          React.createElement('div', { style: { display: 'flex', gap: '8px' } },
            ['dashboard', 'chat', 'applepay'].map((tab) =>
              React.createElement('button', {
                key: tab,
                onClick: () => setActiveTab(tab),
                style: { backgroundColor: activeTab === tab ? '#0071E3' : 'transparent', color: activeTab === tab ? '#fff' : '#1D1D1F', border: 'none', padding: '6px 14px', borderRadius: '20px', fontSize: '13px', fontWeight: 500, cursor: 'pointer' }
              }, tab === 'dashboard' ? 'Inicio' : tab === 'chat' ? 'IA Asistente' : 'Apple Pay')
            )
          )
        ),
        React.createElement('main', { style: { maxWidth: '680px', margin: '24px auto', padding: '0 16px' } },
          activeTab === 'dashboard' && React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '20px' } },
            React.createElement('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '16px' } },
              React.createElement('div
