<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiEssential</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif; background-color: #F5F5F7; color: #1D1D1F; }
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  </style>
</head>
<body class="min-h-screen pb-12">
  <header class="glass sticky top-0 z-50 border-b border-black/5 px-5 py-3 flex justify-between items-center">
    <h1 class="text-lg font-semibold tracking-tight">Mi<span class="text-[#0071E3]">Essential</span></h1>
    <div class="flex gap-1 bg-[#E3E3E8] p-1 rounded-full text-xs font-medium overflow-x-auto">
      <button onclick="switchTab('dashboard')" id="btn-dashboard" class="px-3 py-1.5 rounded-full bg-white shadow-sm transition-all">Inicio</button>
      <button onclick="switchTab('fixed')" id="btn-fixed" class="px-3 py-1.5 rounded-full text-[#515154] transition-all">Gastos Fijos</button>
      <button onclick="switchTab('applepay')" id="btn-applepay" class="px-3 py-1.5 rounded-full text-[#515154] transition-all">Apple Pay</button>
      <button onclick="switchTab('chat')" id="btn-chat" class="px-3 py-1.5 rounded-full text-[#515154] transition-all">IA</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-6" id="app-container">
    <!-- Contenido dinámico -->
  </main>

  <script>
    let currentTab = 'dashboard';
    const budgetLimit = 750;
    const initialSavings = 1650;

    let fixedExpenses = [
      { id: 1, name: "Alquiler / Hipoteca", amount: 450, category: "Hogar" },
      { id: 2, name: "Suministros (Luz/Agua)", amount: 90, category: "Hogar" },
      { id: 3, name: "Gimnasio", amount: 35, category: "Salud" },
      { id: 4, name: "Suscripciones", amount: 20, category: "Ocio" }
    ];

    let transactions = [
      { id: 1, merchant: "Planeta Huerto", amount: 14.50, category: "Supermercado & Alimentación", date: "Hoy, 10:30" },
      { id: 2, merchant: "Spotify", amount: 10.99, category: "Suscripciones & Apps", date: "Ayer" },
      { id: 3, merchant: "Cafetería Local", amount: 3.80, category: "Ocio & Restaurantes", date: "Hace 2 días" }
    ];

    let chatMessages = [{ role: "assistant", text: "¡Hola! Soy tu asistente financiero de MiEssential. ¿Cómo vas este mes?" }];

    // Capturar pagos automáticos enviados por URL desde el Atajo del iPhone
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const autoMerchant = urlParams.get('merchant');
      const autoAmount = urlParams.get('amount');
      const autoCategory = urlParams.get('category');

      if (autoMerchant && autoAmount) {
        transactions.unshift({
          id: Date.now(),
          merchant: decodeURIComponent(autoMerchant),
          amount: parseFloat(autoAmount),
          category: autoCategory ? decodeURIComponent(autoCategory) : "Otros",
          date: "Justo ahora (Atajo iOS)"
        });
      }
      render();
    });

    function switchTab(tab) {
      currentTab = tab;
      ['dashboard', 'fixed', 'applepay', 'chat'].forEach(t => {
        const btn = document.getElementById(`btn-${t}`);
        if (btn) {
          btn.className = t === tab ? "px-3 py-1.5 rounded-full bg-white shadow-sm text-[#1D1D1F] transition-all" : "px-3 py-1.5 rounded-full text-[#515154] transition-all";
        }
      });
      render();
    }

    function render() {
      const container = document.getElementById('app-container');
      const totalVariableSpent = transactions.reduce((acc, t) => acc + t.amount, 0);
      const totalFixedSpent = fixedExpenses.reduce((acc, f) => acc + f.amount, 0);
      const totalAvailable = budgetLimit - totalVariableSpent;
      const excess = totalVariableSpent > budgetLimit ? totalVariableSpent - budgetLimit : 0;
      const effectiveSavings = Math.max(0, initialSavings - excess);

      if (currentTab === 'dashboard') {
        const categories = {
          "Supermercado & Alimentación": { limit: 250, spent: transactions.filter(t => t.category === "Supermercado & Alimentación").reduce((a,b)=>a+b.amount,0) },
          "Ocio & Restaurantes": { limit: 200, spent: transactions.filter(t => t.category === "Ocio & Restaurantes").reduce((a,b)=>a+b.amount,0) },
          "Suscripciones & Apps": { limit: 100, spent: transactions.filter(t => t.category === "Suscripciones & Apps").reduce((a,b)=>a+b.amount,0) },
          "Otros": { limit: 200, spent: transactions.filter(t => t.category === "Otros").reduce((a,b)=>a+b.amount,0) }
        };

        container.innerHTML = `
          <div class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-white p-5 rounded-2xl shadow-sm border border-black/5">
                <p class="text-xs font-medium text-[#86868B] mb-1">Total Disponible</p>
                <h2 class="text-2xl font-bold ${totalAvailable >= 0 ? 'text-[#1D1D1F]' : 'text-[#FF3B30]'}">${totalAvailable.toFixed(2)} €</h2>
              </div>
              <div class="bg-white p-5 rounded-2xl shadow-sm border border-black/5">
                <p class="text-xs font-medium text-[#86868B] mb-1">Total Ahorros</p>
                <h2 class="text-2xl font-bold text-[#0071E3]">${effectiveSavings.toFixed(2)} €</h2>
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-black/5">
              <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold">Presupuesto Base (${budgetLimit} €)</h3>
                <span class="text-xs text-[#86868B]">${totalVariableSpent.toFixed(2)} € / ${budgetLimit} €</span>
              </div>
              <div class="w-full h-2.5 bg-[#E5E5EA] rounded-full overflow-hidden mb-2">
                <div class="h-full ${totalVariableSpent > budgetLimit ? 'bg-[#FF3B30]' : 'bg-[#0071E3]'} rounded-full transition-all" style="width: ${Math.min(100, (totalVariableSpent/budgetLimit)*100)}%"></div>
              </div>
              <p class="text-[11px] text-[#86868B]">Gastos fijos mensuales: <strong>${totalFixedSpent.toFixed(2)} €</strong></p>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-black/5">
              <h3 class="text-sm font-semibold mb-4">Gráfico y Desglose por Categorías</h3>
              <div class="space-y-4">
                ${Object.entries(categories).map(([cat, data]) => {
                  const pct = Math.min(100, Math.round((data.spent / data.limit) * 100));
                  return `
                    <div>
                      <div class="flex justify-between text-xs font-medium mb-1">
                        <span>${cat}</span>
                        <span class="text-[#86868B]">${data.spent.toFixed(2)} € / ${data.limit} €</span>
                      </div>
                      <div class="w-full h-2 bg-[#E5E5EA] rounded-full overflow-hidden">
                        <div class="h-full ${pct > 90 ? 'bg-[#FF3B30]' : 'bg-[#34C759]'} rounded-full transition-all" style="width: ${pct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-black/5">
              <h3 class="text-sm font-semibold mb-3">Últimos Movimientos</h3>
              <div class="divide-y divide-black/5">
                ${transactions.map(t => `
                  <div class="py-3 flex justify-between items-center text-sm">
                    <div>
                      <p class="font-medium">${t.merchant}</p>
                      <p class="text-xs text-[#86868B]">${t.date} • ${t.category}</p>
                    </div>
                    <span class="font-semibold text-[#FF3B30]">- ${t.amount.toFixed(2)} €</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (currentTab === 'fixed') {
        container.innerHTML = `
          <div class="space-y-5">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-black/5">
              <h3 class="text-sm font-semibold mb-1">Gestión de Gastos Fijos</h3>
              <p class="text-xs text-[#86868B] mb-4">Añade o modifica tus obligaciones mensuales recurrentes:</p>
              <div class="space-y-3 mb-6">
                ${fixedExpenses.map(f => `
                  <div class="flex justify-between items-center p-3 bg-[#F9F9FB] rounded-xl text-sm">
                    <div>
                      <p class="font-medium">${f.name}</p>
                      <p class="text-xs text-[#86868B]">${f.category}</p>
                    </div>
                    <div class="flex items-center gap-3">
                      <span class="font-semibold">${f.amount.toFixed(2)} €</span>
                      <button onclick="removeFixed(${f.id})" class="text-[#FF3B30] text-xs font-medium">Eliminar</button>
                    </div>
                  </div>
                `).join('')}
              </div>
              
              <form onsubmit="addFixedExpense(event)" class="space-y-3 pt-4 border-t border-black/5">
                <h4 class="text-xs font-semibold uppercase tracking-wider text-[#86868B]">Añadir Nuevo Gasto Fijo</h4>
                <input type="text" id="fixed-name" placeholder="Concepto (ej. Luz, Alquiler)" required class="w-full px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-xs outline-none focus:border-[#0071E3]">
                <input type="number" step="0.01" id="fixed-amount" placeholder="Importe mensual en €" required class="w-full px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-xs outline-none focus:border-[#0071E3]">
                <button type="submit" class="w-full bg-[#0071E3] text-white py-2.5 rounded-xl text-xs font-semibold shadow-sm">Guardar Gasto Fijo</button>
              </form>
            </div>
          </div>
        `;
      } else if (currentTab === 'applepay') {
        container.innerHTML = `
          <div class="bg-white p-5 rounded-2xl shadow-sm border border-black/5">
            <h3 class="text-sm font-semibold mb-1">Simulador de Apple Pay</h3>
            <p class="text-xs text-[#86868B] mb-4">Simula un gasto o prueba la conexión con el atajo:</p>
            <form onsubmit="handleApplePay(event)" class="space-y-3">
              <input type="text" id="pay-merchant" placeholder="Comercio (ej. Mercadona, Zara)" required class="w-full px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-xs outline-none focus:border-[#0071E3]">
              <input type="number" step="0.01" id="pay-amount" placeholder="Importe en € (ej. 15.90)" required class="w-full px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-xs outline-none focus:border-[#0071E3]">
              <select id="pay-category" class="w-full px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-xs outline-none bg-white focus:border-[#0071E3]">
                <option value="Supermercado & Alimentación">Supermercado & Alimentación</option>
                <option value="Ocio & Restaurantes">Ocio & Restaurantes</option>
                <option value="Suscripciones & Apps">Suscripciones & Apps</option>
                <option value="Otros">Otros</option>
              </select>
              <button type="submit" class="w-full bg-[#34C759] text-white py-3 rounded-xl text-xs font-semibold shadow-sm">Simular Gasto</button>
            </form>
          </div>
        `;
      } else if (currentTab === 'chat') {
        container.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-black/5 flex flex-col h-[480px] p-4">
            <h3 class="text-sm font-semibold mb-3">Asistente IA Gemini</h3>
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 pr-2 mb-3">
              ${chatMessages.map(m => `
                <div class="max-w-[85%] p-3 rounded-2xl text-xs leading-relaxed ${m.role === 'user' ? 'ml-auto bg-[#0071E3] text-white' : 'mr-auto bg-[#F2F2F7] text-[#1D1D1F]'}">
                  ${m.text}
                </div>
              `).join('')}
            </div>
            <form onsubmit="handleChat(event)" class="flex gap-2">
              <input type="text" id="chat-input" placeholder="Pregúntale sobre tus finanzas..." class="flex-1 px-4 py-2.5 rounded-xl border border-[#D2D2D7] text-xs outline-none focus:border-[#0071E3]">
              <button type="submit" class="bg-[#0071E3] text-white px-4 py-2.5 rounded-xl text-xs font-medium">Enviar</button>
            </form>
          </div>
        `;
        const chatBox = document.getElementById('chat-messages');
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function addFixedExpense(e) {
      e.preventDefault();
      const name = document.getElementById('fixed-name').value;
      const amount = parseFloat(document.getElementById('fixed-amount').value);
      if (!name || isNaN(amount)) return;
      fixedExpenses.push({ id: Date.now(), name, amount, category: "Hogar" });
      switchTab('dashboard');
    }

    function removeFixed(id) {
      fixedExpenses = fixedExpenses.filter(f => f.id !== id);
      render();
    }

    function handleApplePay(e) {
      e.preventDefault();
      const merchant = document.getElementById('pay-merchant').value;
      const amount = parseFloat(document.getElementById('pay-amount').value);
      const category = document.getElementById('pay-category').value;
      if (!merchant || isNaN(amount)) return;
      transactions.unshift({ id: Date.now(), merchant, amount, category, date: "Justo ahora" });
      switchTab('dashboard');
    }

    function handleChat(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      chatMessages.push({ role: 'user', text });
      input.value = '';
      render();

      setTimeout(() => {
        const totalVar = transactions.reduce((acc, t) => acc + t.amount, 0);
        const totalFix = fixedExpenses.reduce((acc, f) => acc + f.amount, 0);
        chatMessages.push({ role: 'assistant', text: `Llevas gastados ${totalVar.toFixed(2)}€ en variable de tu base de ${budgetLimit}€ y ${totalFix.toFixed(2)}€ en fijos. ¡Vas por buen camino!` });
        render();
      }, 500);
    }
  </script>
</body>
</html>
